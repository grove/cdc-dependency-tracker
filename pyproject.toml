[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdc-dependency-tracker"
version = "0.1.0"
description = "CDC-based dependency tracker for database change propagation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    { name = "CDC Tracker Team" }
]
dependencies = [
    "sqlglot>=20.0.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pgoutput-decoder>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "ty>=0.0.17",
    "testcontainers>=3.7.0",
]

[project.scripts]
cdc-tracker = "cdc_dependency_tracker.cli:cli"
cdc-percolator = "cdc_dependency_tracker.percolator_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: end-to-end integration tests that require Docker/testcontainers",
]
